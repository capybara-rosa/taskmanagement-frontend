apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager
  namespace: argocd # must match where ArgoCD is installed
  labels:
    app.kubernetes.io/name: task-manager
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade-delete resources on app removal
spec:
  project: default

  source:
    # Replace with your GitHub repo URL
    repoURL: https://github.com/capybara-rosa/taskmanagement-frontend:latest.git
    targetRevision: main
    path: k8s # directory of manifests inside the repo

  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager

  syncPolicy:
    automated:
      prune: true # remove K8s resources deleted from git
      selfHeal: true # revert manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true # create the namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
